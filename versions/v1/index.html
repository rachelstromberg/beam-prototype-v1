function concerns(){return `<figure><figcaption>High ratings can accompany consequential concerns</figcaption><div class="legend"><span><i class="key low"></i>Rated 1–3</span><span><i class="key high"></i>Rated 4–5</span></div>${data.concerns.map(r=>`<div class="concern-row"><div class="bar-label">${esc(r.label)}<small>${r.count} reports</small></div><div class="stack-area"><div class="stack" style="width:${r.count/6*100}%" aria-hidden="true"><span class="low" style="width:${r.low/r.count*100}%">${r.low}</span><span class="high" style="width:${r.high/r.count*100}%">${r.high}</span></div><span class="sr-only">${r.low} rated 1–3; ${r.high} rated 4–5.</span></div></div>`).join('')}<div class="bar-axis"><span>0</span><span>3</span><span>6 reports</span></div></figure>`}
function templates(){return `<div class="template-explorer"><div class="template-list" id="template-list"><table><caption>User ratings by template</caption><thead><tr><th scope="col">Template</th><th scope="col">Average<br>rating</th><th scope="col">Rated<br>1–2</th><th scope="col">Written<br>comments</th></tr></thead><tbody>${configs.map((r,i)=>`<tr data-config="${i}" class="${i===0?'selected':''}"><th scope="row"><button type="button" data-template="${i}" aria-controls="template-feedback" aria-pressed="${i===0}" aria-label="View feedback for ${esc(r.name)}"><span>${esc(r.name)}</span><span class="row-arrow" aria-hidden="true">→</span></button></th><td><strong>${f(r.average)}<span>/5</span></strong><small>${r.n} ratings</small></td><td>${r.distribution[0]+r.distribution[1]} of ${r.n}</td><td>${r.written}</td></tr>`).join('')}</tbody></table></div><section class="feedback-panel" id="template-feedback" aria-labelledby="feedback-title" aria-live="polite" aria-atomic="true"></section></div>`}
function renderFeedback(index, userInitiated=false){

 });
 document.querySelector('#template-feedback').innerHTML=`<p class="eyebrow">WRITTEN FEEDBACK</p><h3 id="feedback-title" tabindex="-1">${esc(r.name)}</h3><p class="feedback-count">${r.written} comments from ${r.n} rated summaries</p>${r.feedback.length?`<ul class="feedback-phrases">${r.feedback.map(v=>`<li><span>“${esc(v.text)}”</span><strong>${v.count}<small>comment${v.count===1?'':'s'}</small></strong></li>`).join('')}</ul>`:'<p>No written feedback for this template.</p>'}<a class="back-to-templates" href="#template-list">↑ Back to templates</a>`;

function methodology(){return `<details class="methodology"><summary>Methodology & data coverage</summary><div class="method-grid"><div><h3>Scope and interpretation</h3><p>Historical sample across ${c.councils} councils: ${c.transcripts} transcript records and ${c.attempts} summary attempts referencing ${c.distinctLinked} distinct transcripts. ${c.single} linked transcripts have one attempt and ${c.multiple} have multiple. ${c.multipleTemplates} link to multiple templates; one has two attempts with the same template. These relationships do not establish why a transcript was reused or whether an attempt was a retry.</p><p>${c.unlinked} transcripts have <strong>no linked summary in supplied extract</strong>; they are not classified as failures or definitively unsummarized. ${c.crossCouncil} transcripts link through summary users to multiple councils; this does not establish collaboration, attendance, ownership, or authorized sharing.</p><p>The presentation proposes improvements; it does not monitor live production, prove causes, or establish service-user outcomes, productivity gains, or cost savings. Current review and recovery processes are not described in these files. Recommendations do not assume that those processes are absent. Proposed success measures require baselines and the relevant events to be recorded.</p><h3>Reported concerns</h3><p>There are ${c.written} written comments among ${c.feedback} feedback records. The three categories use exact matches after trimming whitespace; they are not exhaustive or confirmed errors. Original transcript and generated-note text are absent.</p><ul>${data.concerns.map(r=>`<li><strong>${esc(r.label)}:</strong> “${esc(r.match)}”</li>`).join('')}</ul><p>Repeated wording does not establish how feedback was collected. Individual comment lists are omitted because they repeat these phrases.</p></div><div><h3>Ratings and comparisons</h3><p>All primary and referenced keys were validated. Many-to-one joins preserve 200 attempts. Each of the 150 feedback records refers to a different completed summary in this extract. Ratings describe only those rated summaries.</p><p>Average rating is the arithmetic mean. The “Rated 1–2” column shows the number of ratings of 1 or 2 out of all ratings for that template. Written-comment counts exclude empty comments. Templates are ordered from lowest to highest average rating. Selecting a template reveals all its nonempty comments, grouped by exact wording and counted once per feedback record. Positive and critical feedback are both retained; no automated classification or selective excerpting is used.</p><p>Each template uses one recorded model in this extract. The comparisons describe the observed template/model configurations, not isolated template or model effects. Small samples, task differences, selection, and repeated transcripts limit inference. Template metadata does not establish historical prompt-version provenance. Compare current and revised prompts on the same representative cases, using a practitioner checklist for correct names, supported safeguarding flags, and retained risk details. Track editing minutes alongside accuracy.</p><h3>Processing times and status</h3><p>Times use 173 completed attempts with recorded processing milliseconds, divided by 1,000. Word-count bands are [0, 3000), [3000, 6000), [6000, 9000), and 9000+. The 90th percentile uses linear interpolation at position (n−1) × 0.9 in the sorted values. Chart times are rounded to whole seconds. These marks show slower recorded waits, not guaranteed completion times or error bars.</p><p>Length is associated with processing time; this does not identify a bottleneck or establish staff disruption. Recording-to-summary timestamp differences are not used as latency.</p><p>In-progress age is measured relative to <strong>${esc(data.reference)}</strong>, the latest summary creation timestamp—not a confirmed export date. Source timezone is unspecified. These are not live backlog counts or proof of months spent waiting. Fifteen failures without error logs cannot establish a reliable causal pattern.</p><p>Source: the five supplied CSV extracts. All original headline figures reconcile. The app bundles aggregates, grouped comment phrases, and the three concern definitions, with no individual feedback records, names, emails, source identifiers, or credentials.</p></div></div></details>`}

name: Frozen version integrity

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify frozen snapshots
        run: python3 scripts/verify-frozen-versions.py
